<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Canais YouTube</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="container">
      <section class="card header">
        <div>
          <h1>Gerenciador de Canais</h1>
          <p class="muted">Agenda de postagens por canal</p>
        </div>
        <div class="stats">
          <div class="stat">
            <span class="muted">Canais</span>
            <strong id="total-canais">0</strong>
          </div>
          <div class="stat">
            <span class="muted">Nesta semana</span>
            <strong id="total-semana">0</strong>
          </div>
          <div class="stat">
            <span class="muted">Publicados</span>
            <strong id="total-publicados">0</strong>
          </div>
        </div>
      </section>

      <nav class="tabs">
        <button id="tab-semana" class="tab active" data-tab="semana">Semana</button>
        <button id="tab-canais" class="tab" data-tab="canais">Canais</button>
        <button id="tab-planejamento" class="tab" data-tab="planejamento">Produção</button>
        <button id="tab-anotacoes" class="tab" data-tab="anotacoes">Anotações</button>
        <button id="tab-dashboard" class="tab" data-tab="dashboard">Dashboard</button>
      </nav>

      <section class="card" style="margin-top: 12px;">
        <div class="toolbar">
          <h2 id="painel-titulo">Semana</h2>
          <div class="actions">
            <button id="btn-novo-canal" class="btn primary">Novo canal</button>
            <button id="btn-novo-video" class="btn primary">Novo conteúdo</button>
            <button id="btn-sync" class="btn">Recarregar dados</button>
          </div>
        </div>
        <p id="sync-status" class="muted hide" style="margin: 0 0 10px 0;"></p>

        <form id="key-form" class="card hide" style="margin-bottom: 10px;">
          <div class="field">
            <label for="api-key-input">Chave de acesso</label>
            <input id="api-key-input" type="password" autocomplete="current-password" placeholder="Cole a chave de acesso da API">
          </div>
          <p class="muted" style="margin: 6px 0 10px 0;">Fica salva só neste navegador.</p>
          <div class="actions">
            <button class="btn primary" type="submit">Entrar</button>
          </div>
        </form>

        <div id="search-wrap" class="filters hide">
          <div class="field">
            <label for="search">Busca</label>
            <input id="search" type="text" placeholder="Buscar por título ou canal...">
          </div>
          <div class="field">
            <label for="filter-canal">Canal</label>
            <select id="filter-canal"></select>
          </div>
          <div class="field">
            <label for="filter-tipo">Tipo</label>
            <select id="filter-tipo"></select>
          </div>
          <div class="field">
            <label for="filter-date">Data</label>
            <input id="filter-date" type="date">
          </div>
          <div class="field field-inline" style="justify-content:flex-end;">
            <label class="check-inline" for="filter-all-dates">
              <input id="filter-all-dates" type="checkbox">
              <span>Todas as datas</span>
            </label>
          </div>
        </div>

        <div id="content"></div>
      </section>
    </main>

    <!-- Formulário de canal (janela) -->
    <div id="canal-form-card" class="modal-backdrop hide">
      <div class="card modal" role="dialog" aria-modal="true" aria-labelledby="canal-form-titulo">
        <h3 id="canal-form-titulo" style="margin-bottom: 10px;">Canal</h3>
        <form id="canal-form" class="form">
          <div class="form-row">
            <div class="field" style="flex:1;">
              <label for="canal-nome">Nome *</label>
              <input id="canal-nome" required>
            </div>
            <div class="field">
              <label for="canal-cor">Cor</label>
              <input id="canal-cor" type="color" value="#dc2626">
            </div>
          </div>
          <div class="field">
            <label for="canal-url">URL</label>
            <input id="canal-url" type="url" placeholder="https://www.youtube.com/@...">
          </div>
          <div class="field">
            <label for="canal-nicho">Nicho</label>
            <input id="canal-nicho">
          </div>
          <div class="field">
            <label for="canal-descricao">Descrição</label>
            <textarea id="canal-descricao" rows="3"></textarea>
          </div>
          <div class="actions">
            <button id="canal-submit" class="btn primary" type="submit">Adicionar canal</button>
            <button id="cancel-canal" class="btn" type="button">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Formulário de conteúdo (janela) -->
    <div id="video-form-card" class="modal-backdrop hide">
      <div class="card modal" role="dialog" aria-modal="true" aria-labelledby="video-form-titulo">
        <h3 id="video-form-titulo" style="margin-bottom: 10px;">Conteúdo</h3>
        <form id="video-form" class="form">
          <div class="field">
            <label for="video-titulo">Título *</label>
            <input id="video-titulo" required>
          </div>
          <div class="form-row">
            <div class="field" style="flex:1;">
              <label for="video-canal">Canal *</label>
              <select id="video-canal" required></select>
            </div>
            <div class="field" style="flex:1;">
              <label for="video-tipo">Tipo</label>
              <select id="video-tipo"></select>
            </div>
          </div>
          <div class="form-row">
            <div class="field" style="flex:1;">
              <label for="video-data">Data de postagem</label>
              <input id="video-data" type="date">
            </div>
            <div class="field">
              <label for="video-horario">Horário</label>
              <input id="video-horario" type="time">
            </div>
            <div class="field" style="flex:1;">
              <label for="video-status">Status</label>
              <select id="video-status">
                <option value="planejado">Planejado</option>
                <option value="em_producao">Em produção</option>
                <option value="pronto">Pronto</option>
                <option value="publicado">Publicado</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="video-url">Link do conteúdo publicado</label>
            <input id="video-url" type="url" placeholder="https://youtu.be/...">
          </div>
          <div class="field">
            <label for="video-notas">Notas / roteiro</label>
            <textarea id="video-notas" rows="4"></textarea>
          </div>
          <div id="video-checklist"></div>
          <div class="actions" style="justify-content: space-between;">
            <div class="actions">
              <button id="video-submit" class="btn primary" type="submit">Adicionar</button>
              <button id="cancel-video" class="btn" type="button">Cancelar</button>
            </div>
            <button id="delete-video" class="btn danger hide" type="button">Excluir</button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
